global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Orchestrator metrics
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8000']
    metrics_path: '/metrics'

  # Red Agent metrics
  - job_name: 'red-agent'
    static_configs:
      - targets: ['red-agent:8000']
    metrics_path: '/metrics'

  # Blue Agent metrics
  - job_name: 'blue-agent'
    static_configs:
      - targets: ['blue-agent:8000']
    metrics_path: '/metrics'

  # ChromaDB metrics
  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8000']

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
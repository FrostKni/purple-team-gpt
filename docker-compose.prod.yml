# Purple Team GPT - Production Docker Compose
# Production overrides with security hardening
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ============================================
  # Nginx - Production SSL Configuration
  # ============================================
  nginx:
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Certbot - Auto SSL Renewal
  # ============================================
  certbot:
    profiles:
      - ssl
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ============================================
  # Backend - Production Configuration
  # ============================================
  backend:
    build:
      target: production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_LOG_LEVEL=INFO
      # HTTPS enforcement
      - FORCE_HTTPS=true
    volumes: []  # No source mounts in production
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ============================================
  # Frontend - Production Configuration
  # ============================================
  frontend:
    build:
      target: production
    volumes: []
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================
  # ChromaDB - Production Configuration
  # ============================================
  chromadb:
    environment:
      - ALLOW_RESET=false
      - ANONYMIZED_TELEMETRY=false
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security hardening
    security_opt:
      - no-new-privileges:true

  # ============================================
  # PostgreSQL - Production Configuration
  # ============================================
  postgres:
    environment:
      # Password is required and should be set via secrets
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required for production}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # Security hardening
    security_opt:
      - no-new-privileges:true

  # ============================================
  # Redis - Production Configuration
  # ============================================
  redis:
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required for production}
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 300
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --rdbchecksum yes
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Security hardening
    security_opt:
      - no-new-privileges:true

# ============================================
# Production Secrets (override)
# ============================================
secrets:
  app_secret_key:
    external: true
    name: purple_team_app_secret_key
  db_password:
    external: true
    name: purple_team_db_password
  redis_password:
    external: true
    name: purple_team_redis_password

# ============================================
# Production Networks
# ============================================
networks:
  purple-team-network:
    driver: bridge
    name: purple-team-network
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
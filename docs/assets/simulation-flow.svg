<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ca8a04;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">
    Purple Team GPT - Simulation Flow
  </text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#64748b">
    Attack → Detection → Defense → Learning Cycle
  </text>

  <!-- ==================== PHASE 1: USER INITIATES ==================== -->
  <g transform="translate(50, 90)">
    <rect width="180" height="80" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="90" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="white">👤 USER</text>
    <text x="90" y="50" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">Initiates Simulation</text>
    <text x="90" y="65" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Target: 192.168.100.100</text>
  </g>

  <!-- Arrow: User → Orchestrator -->
  <line x1="230" y1="130" x2="280" y2="130" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ==================== PHASE 2: ORCHESTRATOR COORDINATES ==================== -->
  <g transform="translate(290, 70)">
    <rect width="200" height="120" rx="10" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🎯 ORCHESTRATOR</text>
    
    <rect x="10" y="35" width="180" height="75" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text x="100" y="52" text-anchor="middle" font-size="9" fill="white">1. Create simulation</text>
    <text x="100" y="68" text-anchor="middle" font-size="9" fill="white">2. Query Vector DB</text>
    <text x="100" y="84" text-anchor="middle" font-size="9" fill="white">3. Select tools</text>
    <text x="100" y="100" text-anchor="middle" font-size="9" fill="white">4. Dispatch to agents</text>
  </g>

  <!-- ==================== PHASE 3: RED AGENT ATTACKS ==================== -->
  <g transform="translate(530, 70)">
    <rect width="200" height="180" rx="10" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔴 RED AGENT</text>
    <text x="100" y="42" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Offensive Operations</text>
    
    <rect x="10" y="50" width="180" height="120" rx="5" fill="rgba(255,255,255,0.15)"/>
    
    <!-- Attack steps -->
    <circle cx="25" cy="70" r="8" fill="#fef2f2"/>
    <text x="25" y="74" text-anchor="middle" font-size="8" fill="#dc2626">1</text>
    <text x="40" y="74" font-size="8" fill="white">Recon: nmap -sV target</text>
    
    <circle cx="25" cy="95" r="8" fill="#fef2f2"/>
    <text x="25" y="99" text-anchor="middle" font-size="8" fill="#dc2626">2</text>
    <text x="40" y="99" font-size="8" fill="white">Scan: nikto --host target</text>
    
    <circle cx="25" cy="120" r="8" fill="#fef2f2"/>
    <text x="25" y="124" text-anchor="middle" font-size="8" fill="#dc2626">3</text>
    <text x="40" y="124" font-size="8" fill="white">Exploit: sqlmap -u url</text>
    
    <circle cx="25" cy="145" r="8" fill="#fef2f2"/>
    <text x="25" y="149" text-anchor="middle" font-size="8" fill="#dc2626">4</text>
    <text x="40" y="149" font-size="8" fill="white">Report findings</text>
  </g>

  <!-- ==================== TARGET SYSTEM ==================== -->
  <g transform="translate(770, 90)">
    <rect width="180" height="80" rx="10" fill="#374151" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🎯 TARGET</text>
    <text x="90" y="45" text-anchor="middle" font-size="9" fill="#9ca3af">DVWA / Vuln App</text>
    <text x="90" y="62" text-anchor="middle" font-size="8" fill="#6b7280">192.168.100.100</text>
    
    <!-- Attack indicators -->
    <text x="90" y="75" text-anchor="middle" font-size="8" fill="#fca5a5">⚡ Under Attack</text>
  </g>

  <!-- Arrow: Orchestrator → Red Agent -->
  <line x1="490" y1="110" x2="530" y2="110" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  
  <!-- Arrow: Red Agent → Target -->
  <line x1="730" y1="130" x2="770" y2="130" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)">
    <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- ==================== PHASE 4: BLUE AGENT DEFENDS ==================== -->
  <g transform="translate(770, 200)">
    <rect width="180" height="180" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔵 BLUE AGENT</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Defensive Operations</text>
    
    <rect x="10" y="50" width="160" height="120" rx="5" fill="rgba(255,255,255,0.15)"/>
    
    <!-- Defense steps -->
    <circle cx="25" cy="70" r="8" fill="#dbeafe"/>
    <text x="25" y="74" text-anchor="middle" font-size="8" fill="#2563eb">1</text>
    <text x="40" y="74" font-size="8" fill="white">Monitor: tcpdump/zeek</text>
    
    <circle cx="25" cy="95" r="8" fill="#dbeafe"/>
    <text x="25" y="99" text-anchor="middle" font-size="8" fill="#2563eb">2</text>
    <text x="40" y="99" font-size="8" fill="white">Detect: suricata alerts</text>
    
    <circle cx="25" cy="120" r="8" fill="#dbeafe"/>
    <text x="25" y="124" text-anchor="middle" font-size="8" fill="#2563eb">3</text>
    <text x="40" y="124" font-size="8" fill="white">Block: iptables DROP</text>
    
    <circle cx="25" cy="145" r="8" fill="#dbeafe"/>
    <text x="25" y="149" text-anchor="middle" font-size="8" fill="#2563eb">4</text>
    <text x="40" y="149" font-size="8" fill="white">Report countermeasures</text>
  </g>

  <!-- Arrow: Target → Blue Agent (logs/alerts) -->
  <path d="M 860 170 L 860 200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="875" y="185" font-size="8" fill="#3b82f6">logs</text>

  <!-- ==================== PHASE 5: LEARNING ENGINE ==================== -->
  <g transform="translate(290, 280)">
    <rect width="200" height="140" rx="10" fill="url(#yellowGrad)" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🧠 LEARNING ENGINE</text>
    <text x="100" y="42" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Feedback & Memory</text>
    
    <rect x="10" y="50" width="180" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="68" text-anchor="middle" font-size="9" fill="white">📊 Analyze Results</text>
    <text x="100" y="85" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.9)">• Attack success rate</text>
    <text x="100" y="100" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.9)">• Defense effectiveness</text>
    <text x="100" y="115" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.9)">• Store in Vector DB</text>
  </g>

  <!-- Arrow: Red Agent → Learning -->
  <path d="M 530 230 Q 480 260 490 280" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  
  <!-- Arrow: Blue Agent → Learning -->
  <path d="M 770 320 Q 600 350 490 320" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- ==================== PHASE 6: VECTOR DB ==================== -->
  <g transform="translate(530, 280)">
    <rect width="180" height="100" rx="10" fill="#7c3aed" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🗄️ CHROMADB</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Vector Memory</text>
    
    <rect x="10" y="50" width="160" height="40" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text x="90" y="68" text-anchor="middle" font-size="8" fill="white">• Successful payloads</text>
    <text x="90" y="82" text-anchor="middle" font-size="8" fill="white">• Defense patterns</text>
  </g>

  <!-- Arrow: Learning → ChromaDB -->
  <line x1="490" y1="350" x2="530" y2="330" stroke="#eab308" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ==================== PHASE 7: HUMAN FEEDBACK ==================== -->
  <g transform="translate(50, 280)">
    <rect width="180" height="140" rx="10" fill="#f59e0b" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">👤 HUMAN FEEDBACK</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Rating & Corrections</text>
    
    <rect x="10" y="50" width="160" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="90" y="68" text-anchor="middle" font-size="9" fill="white">⭐ Rate 1-5 stars</text>
    <text x="90" y="85" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.9)">✏️ Add corrections</text>
    <text x="90" y="102" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.9)">📝 Purple instructions</text>
    <text x="90" y="119" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.9)">🔄 Export to JSONL</text>
  </g>

  <!-- Arrow: Human → Learning -->
  <line x1="230" y1="350" x2="290" y2="350" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ==================== CONTINUOUS IMPROVEMENT LOOP ==================== -->
  <path d="M 630 380 Q 650 450 500 470 Q 350 450 350 420" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowPurple)">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="485" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b5cf6">🔄 Continuous Improvement Loop</text>

  <!-- ==================== IMPROVED AGENTS ==================== -->
  <g transform="translate(290, 440)">
    <rect width="200" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">📈 IMPROVED AGENTS</text>
    <text x="100" y="45" text-anchor="middle" font-size="9" fill="#15803d">Red: Better attack selection</text>
    <text x="100" y="60" text-anchor="middle" font-size="9" fill="#15803d">Blue: Faster detection</text>
    <text x="100" y="75" text-anchor="middle" font-size="9" fill="#15803d">Both: Learning from feedback</text>
  </g>

  <!-- ==================== CYCLE INDICATOR ==================== -->
  <g transform="translate(50, 440)">
    <rect width="180" height="80" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8">🔁 CYCLE</text>
    <text x="90" y="45" text-anchor="middle" font-size="9" fill="#7c3aed">Attack → Defend</text>
    <text x="90" y="60" text-anchor="middle" font-size="9" fill="#7c3aed">→ Learn → Improve</text>
    <text x="90" y="75" text-anchor="middle" font-size="9" fill="#7c3aed">→ Repeat</text>
  </g>

  <!-- ==================== NEXT ITERATION ARROW ==================== -->
  <path d="M 340 520 Q 200 550 140 170" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="180" y="400" font-size="9" fill="#8b5cf6">Next</text>
  <text x="180" y="412" font-size="9" fill="#8b5cf6">iteration</text>

  <!-- ==================== OUTPUT: REPORTS ==================== -->
  <g transform="translate(530, 440)">
    <rect width="200" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">📊 OUTPUT</text>
    <text x="100" y="45" text-anchor="middle" font-size="9" fill="#a16207">• Simulation reports</text>
    <text x="100" y="60" text-anchor="middle" font-size="9" fill="#a16207">• Vulnerability findings</text>
    <text x="100" y="75" text-anchor="middle" font-size="9" fill="#a16207">• Defense metrics</text>
  </g>

  <!-- ==================== JSONL EXPORT ==================== -->
  <g transform="translate(770, 440)">
    <rect width="180" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">💾 EXPORT</text>
    <text x="90" y="45" text-anchor="middle" font-size="9" fill="#059669">• JSONL for fine-tuning</text>
    <text x="90" y="60" text-anchor="middle" font-size="9" fill="#059669">• Attack patterns</text>
    <text x="90" y="75" text-anchor="middle" font-size="9" fill="#059669">• Defense playbooks</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(50, 560)">
    <rect width="900" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="450" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Flow Legend</text>
    
    <circle cx="50" cy="45" r="10" fill="#22c55e"/>
    <text x="70" y="50" font-size="9" fill="#334155">Start</text>
    
    <circle cx="150" cy="45" r="10" fill="#8b5cf6"/>
    <text x="170" y="50" font-size="9" fill="#334155">Coordinate</text>
    
    <circle cx="260" cy="45" r="10" fill="#ef4444"/>
    <text x="280" y="50" font-size="9" fill="#334155">Attack</text>
    
    <circle cx="360" cy="45" r="10" fill="#3b82f6"/>
    <text x="380" y="50" font-size="9" fill="#334155">Defend</text>
    
    <circle cx="460" cy="45" r="10" fill="#eab308"/>
    <text x="480" y="50" font-size="9" fill="#334155">Learn</text>
    
    <circle cx="560" cy="45" r="10" fill="#f59e0b"/>
    <text x="580" y="50" font-size="9" fill="#334155">Feedback</text>
    
    <line x1="670" y1="45" x2="710" y2="45" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="720" y="50" font-size="9" fill="#334155">Improvement Loop</text>
    
    <rect x="820" y="35" width="60" height="20" rx="4" fill="#7c3aed"/>
    <text x="850" y="49" text-anchor="middle" font-size="8" fill="white">Memory</text>
  </g>

  <!-- ==================== TIMELINE ==================== -->
  <g transform="translate(50, 650)">
    <line x1="0" y1="10" x2="900" y2="10" stroke="#cbd5e1" stroke-width="2"/>
    
    <circle cx="0" cy="10" r="6" fill="#22c55e"/>
    <text x="0" y="35" text-anchor="middle" font-size="8" fill="#334155">T=0</text>
    
    <circle cx="150" cy="10" r="6" fill="#8b5cf6"/>
    <text x="150" y="35" text-anchor="middle" font-size="8" fill="#334155">T=1</text>
    
    <circle cx="350" cy="10" r="6" fill="#ef4444"/>
    <text x="350" y="35" text-anchor="middle" font-size="8" fill="#334155">T=2</text>
    
    <circle cx="550" cy="10" r="6" fill="#3b82f6"/>
    <text x="550" y="35" text-anchor="middle" font-size="8" fill="#334155">T=3</text>
    
    <circle cx="750" cy="10" r="6" fill="#eab308"/>
    <text x="750" y="35" text-anchor="middle" font-size="8" fill="#334155">T=4</text>
    
    <circle cx="900" cy="10" r="6" fill="#8b5cf6"/>
    <text x="900" y="35" text-anchor="middle" font-size="8" fill="#334155">Next</text>
    
    <text x="75" y="0" font-size="7" fill="#64748b">Init</text>
    <text x="250" y="0" font-size="7" fill="#64748b">Dispatch</text>
    <text x="450" y="0" font-size="7" fill="#64748b">Execute</text>
    <text x="650" y="0" font-size="7" fill="#64748b">Analyze</text>
    <text x="825" y="0" font-size="7" fill="#64748b">Improve</text>
  </g>

</svg>
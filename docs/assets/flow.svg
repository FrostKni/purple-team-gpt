<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="redGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="purpleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22C55E"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="520" fill="#0F172A"/>
  
  <!-- Grid -->
  <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="520" fill="url(#grid2)" opacity="0.3"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC">Purple Team Simulation Flow</text>
  
  <!-- Step 1: User Input -->
  <g filter="url(#glow2)">
    <circle cx="100" cy="100" r="35" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <text x="100" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#F8FAFC">👤</text>
    <text x="100" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94A3B8">User</text>
  </g>
  
  <path d="M135 100 L175 100" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Create Session -->
  <g filter="url(#glow2)">
    <rect x="180" y="70" width="120" height="60" rx="8" fill="#8B5CF6"/>
    <text x="240" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Create Session</text>
    <text x="240" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#E9D5FF">Target + Config</text>
  </g>
  
  <path d="M300 100 L340 100" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Orchestrator -->
  <g filter="url(#glow2)">
    <rect x="345" y="60" width="150" height="80" rx="10" fill="url(#purpleGrad3)" stroke="#C4B5FD" stroke-width="2"/>
    <text x="420" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🟣 Orchestrator</text>
    <text x="420" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#F3E8FF">Initialize Agents</text>
    <text x="420" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#DDD6FE">Coordinate Execution</text>
  </g>
  
  <!-- Split to Red and Blue - Different paths to avoid overlap -->
  <path d="M380 140 L380 165 L200 165 L200 200" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  <path d="M460 140 L460 165 L700 165 L700 200" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>
  
  <!-- Red Agent Branch -->
  <g filter="url(#glow2)">
    <rect x="100" y="205" width="200" height="130" rx="10" fill="#7F1D1D" stroke="#F87171" stroke-width="2"/>
    <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FCA5A5">🔴 RED AGENT</text>
    
    <!-- Red steps -->
    <rect x="115" y="245" width="170" height="25" rx="4" fill="#450A0A"/>
    <text x="200" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FEE2E2">1. Query Vector DB</text>
    
    <rect x="115" y="275" width="170" height="25" rx="4" fill="#450A0A"/>
    <text x="200" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FEE2E2">2. LLM Generate Plan</text>
    
    <rect x="115" y="305" width="170" height="25" rx="4" fill="#450A0A"/>
    <text x="200" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FEE2E2">3. Execute Attack</text>
  </g>
  
  <!-- Blue Agent Branch -->
  <g filter="url(#glow2)">
    <rect x="600" y="205" width="200" height="130" rx="10" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
    <text x="700" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93C5FD">🔵 BLUE AGENT</text>
    
    <!-- Blue steps -->
    <rect x="615" y="245" width="170" height="25" rx="4" fill="#172554"/>
    <text x="700" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DBEAFE">1. Monitor System</text>
    
    <rect x="615" y="275" width="170" height="25" rx="4" fill="#172554"/>
    <text x="700" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DBEAFE">2. Detect Anomaly</text>
    
    <rect x="615" y="305" width="170" height="25" rx="4" fill="#172554"/>
    <text x="700" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DBEAFE">3. Deploy Response</text>
  </g>
  
  <!-- Cross-communication arrows - Offset to avoid overlap -->
  <path d="M300 265 L600 265" stroke="#A855F7" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowPurple)" fill="none"/>
  <text x="450" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C4B5FD">Notify Actions</text>
  
  <path d="M600 305 L300 305" stroke="#22C55E" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="450" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#86EFAC">Defense Feedback</text>
  
  <!-- Results Box - Centered -->
  <g filter="url(#glow2)">
    <rect x="320" y="400" width="200" height="50" rx="8" fill="#059669" stroke="#34D399" stroke-width="2"/>
    <text x="420" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">📊 Results &amp; Metrics</text>
    <text x="420" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#D1FAE5">Findings + Performance</text>
  </g>
  
  <!-- Converge to Results - Different paths to avoid overlap -->
  <path d="M200 335 L200 360 L320 360 L320 400" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  <path d="M700 335 L700 360 L520 360 L520 400" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>
  
  <!-- Human Feedback -->
  <g filter="url(#glow2)">
    <rect x="565" y="400" width="150" height="50" rx="8" fill="#D97706" stroke="#FBBF24" stroke-width="2"/>
    <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">📝 Human Feedback</text>
    <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FEF3C7">Rate + Correct</text>
  </g>
  
  <path d="M520 425 L560 425" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- Vector DB Icon -->
  <g transform="translate(750, 400)">
    <rect width="100" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Vector DB</text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#64748B">(ChromaDB)</text>
    <circle cx="25" cy="40" r="4" fill="#8B5CF6"/>
    <circle cx="50" cy="40" r="4" fill="#A855F7"/>
    <circle cx="75" cy="40" r="4" fill="#C084FC"/>
  </g>
  
  <path d="M715 425 L750 425" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  
  <!-- Learning Loop - Redesigned to not overlap -->
  <path d="M640 450 L640 475 L100 475 L100 390 L150 390 L150 340" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowPurple)" fill="none"/>
  <text x="370" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C4B5FD">🔄 Learning Loop - Store in Vector DB for Future Sessions</text>
</svg>
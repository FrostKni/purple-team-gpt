<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="cycleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="#0F172A"/>
  
  <!-- Center Circle -->
  <circle cx="300" cy="300" r="80" fill="#1E293B" stroke="url(#cycleGrad)" stroke-width="3" filter="url(#glow3)"/>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ADAPTIVE</text>
  <text x="300" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">LEARNING</text>
  <text x="300" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A78BFA">RAG Pipeline</text>
  
  <!-- Rotating ring -->
  <circle cx="300" cy="300" r="130" fill="none" stroke="#4C1D95" stroke-width="1" stroke-dasharray="10,5">
    <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="300" r="180" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="15,10">
    <animateTransform attributeName="transform" type="rotate" from="360 300 300" to="0 300 300" dur="40s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Step 1: Execute (Top) -->
  <g transform="translate(300, 80)">
    <circle r="50" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">⚡</text>
    <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FCA5A5">EXECUTE</text>
    <text y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#FEE2E2">Agent Action</text>
  </g>
  
  <!-- Step 2: Analyze (Right) -->
  <g transform="translate(520, 300)">
    <circle r="50" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">🔍</text>
    <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#93C5FD">ANALYZE</text>
    <text y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#DBEAFE">Results & Impact</text>
  </g>
  
  <!-- Step 3: Learn (Bottom) -->
  <g transform="translate(300, 520)">
    <circle r="50" fill="#14532D" stroke="#22C55E" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">🧠</text>
    <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#86EFAC">LEARN</text>
    <text y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#DCFCE7">Store Patterns</text>
  </g>
  
  <!-- Step 4: Improve (Left) -->
  <g transform="translate(80, 300)">
    <circle r="50" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">📈</text>
    <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FCD34D">IMPROVE</text>
    <text y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#FEF3C7">Refine Strategy</text>
  </g>
  
  <!-- Curved Arrows -->
  <!-- Execute to Analyze -->
  <path d="M340 115 Q450 150 490 260" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowR)"/>
  
  <!-- Analyze to Learn -->
  <path d="M490 340 Q450 450 340 485" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>
  
  <!-- Learn to Improve -->
  <path d="M260 485 Q150 450 110 340" fill="none" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowG)"/>
  
  <!-- Improve to Execute -->
  <path d="M110 260 Q150 150 260 115" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowY)"/>
  
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22C55E"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>
  
  <!-- Labels on paths -->
  <text x="420" y="160" font-family="Arial, sans-serif" font-size="8" fill="#EF4444">Success/Failure</text>
  <text x="480" y="400" font-family="Arial, sans-serif" font-size="8" fill="#3B82F6">Metrics</text>
  <text x="130" y="400" font-family="Arial, sans-serif" font-size="8" fill="#22C55E">Feedback</text>
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="8" fill="#F59E0B">New Strategy</text>
  
  <!-- Corner Elements -->
  <g transform="translate(50, 50)">
    <rect width="100" height="40" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Vector Store</text>
  </g>
  
  <g transform="translate(450, 50)">
    <rect width="100" height="40" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Human Input</text>
  </g>
  
  <g transform="translate(50, 510)">
    <rect width="100" height="40" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Fine-Tuning</text>
  </g>
  
  <g transform="translate(450, 510)">
    <rect width="100" height="40" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Export Data</text>
  </g>
</svg>
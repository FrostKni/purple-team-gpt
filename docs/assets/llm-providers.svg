<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="400" fill="#0F172A"/>
  
  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F8FAFC">Multi-Provider LLM Support</text>
  
  <!-- Central Hub -->
  <circle cx="350" cy="200" r="60" fill="#1E293B" stroke="url(#llmGrad)" stroke-width="3"/>
  <text x="350" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">LLM</text>
  <text x="350" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ENGINE</text>
  <text x="350" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#A78BFA">Auto-Failover</text>
  
  <!-- Provider nodes -->
  
  <!-- OpenAI -->
  <g transform="translate(100, 100)">
    <rect x="-45" y="-25" width="90" height="50" rx="8" fill="#10B981"/>
    <text y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">OpenAI</text>
    <text y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#D1FAE5">GPT-4o, o1</text>
  </g>
  <line x1="145" y1="115" x2="295" y2="170" stroke="#10B981" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Anthropic -->
  <g transform="translate(600, 100)">
    <rect x="-50" y="-25" width="100" height="50" rx="8" fill="#D97706"/>
    <text y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Anthropic</text>
    <text y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FEF3C7">Claude 4</text>
  </g>
  <line x1="555" y1="115" x2="405" y2="170" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Groq -->
  <g transform="translate(100, 300)">
    <rect x="-40" y="-25" width="80" height="50" rx="8" fill="#EC4899"/>
    <text y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Groq</text>
    <text y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FCE7F3">Llama 3.3</text>
  </g>
  <line x1="140" y1="280" x2="295" y2="230" stroke="#EC4899" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Ollama -->
  <g transform="translate(600, 300)">
    <rect x="-45" y="-25" width="90" height="50" rx="8" fill="#8B5CF6"/>
    <text y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Ollama</text>
    <text y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#EDE9FE">Local Models</text>
  </g>
  <line x1="560" y1="280" x2="405" y2="230" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- DeepSeek -->
  <g transform="translate(220, 60)">
    <rect x="-45" y="-20" width="90" height="40" rx="6" fill="#6366F1"/>
    <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">DeepSeek</text>
    <text y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#E0E7FF">Reasoner</text>
  </g>
  <line x1="265" y1="80" x2="310" y2="150" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Mistral -->
  <g transform="translate(480, 60)">
    <rect x="-45" y="-20" width="90" height="40" rx="6" fill="#F59E0B"/>
    <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Mistral</text>
    <text y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#FEF3C7">Large</text>
  </g>
  <line x1="435" y1="80" x2="390" y2="150" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- OpenAI-Compatible -->
  <g transform="translate(350, 340)">
    <rect x="-70" y="-20" width="140" height="40" rx="6" fill="#475569"/>
    <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">OpenAI-Compatible</text>
    <text y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#CBD5E1">OpenRouter, vLLM, LocalAI</text>
  </g>
  <line x1="350" y1="320" x2="350" y2="260" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Priority Labels -->
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#64748B">Priority 2</text>
  <text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#64748B">Priority 3</text>
  <text x="350" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#64748B">Priority 1 (if configured)</text>
  <text x="600" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#64748B">Fallback</text>
  
  <!-- Features Box -->
  <rect x="20" y="180" width="130" height="80" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="85" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#94A3B8">Features</text>
  <text x="30" y="218" font-family="Arial, sans-serif" font-size="7" fill="#64748B">✓ Auto-failover</text>
  <text x="30" y="232" font-family="Arial, sans-serif" font-size="7" fill="#64748B">✓ Load balancing</text>
  <text x="30" y="246" font-family="Arial, sans-serif" font-size="7" fill="#64748B">✓ Rate limit handling</text>
  
  <!-- Status indicators -->
  <circle cx="145" cy="100" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="555" cy="100" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="275" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
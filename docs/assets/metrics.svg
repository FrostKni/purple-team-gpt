<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7F1D1D"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#14532D"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#0F172A"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F8FAFC">Performance Metrics Dashboard</text>
  
  <!-- Bar Chart Area -->
  <rect x="40" y="50" width="350" height="250" rx="8" fill="#1E293B"/>
  <text x="215" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Agent Performance</text>
  
  <!-- Y-axis labels -->
  <text x="55" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748B">100%</text>
  <text x="55" y="155" font-family="Arial, sans-serif" font-size="8" fill="#64748B">75%</text>
  <text x="55" y="205" font-family="Arial, sans-serif" font-size="8" fill="#64748B">50%</text>
  <text x="55" y="255" font-family="Arial, sans-serif" font-size="8" fill="#64748B">25%</text>
  <text x="55" y="295" font-family="Arial, sans-serif" font-size="8" fill="#64748B">0%</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="100" x2="380" y2="100" stroke="#334155" stroke-width="0.5"/>
  <line x1="80" y1="150" x2="380" y2="150" stroke="#334155" stroke-width="0.5"/>
  <line x1="80" y1="200" x2="380" y2="200" stroke="#334155" stroke-width="0.5"/>
  <line x1="80" y1="250" x2="380" y2="250" stroke="#334155" stroke-width="0.5"/>
  <line x1="80" y1="290" x2="380" y2="290" stroke="#475569" stroke-width="1"/>
  
  <!-- Red Agent Bars -->
  <rect x="100" y="130" width="30" height="160" rx="4" fill="url(#barGrad1)"/>
  <rect x="140" y="170" width="30" height="120" rx="4" fill="url(#barGrad1)" opacity="0.7"/>
  <rect x="180" y="200" width="30" height="90" rx="4" fill="url(#barGrad1)" opacity="0.5"/>
  
  <!-- Blue Agent Bars -->
  <rect x="230" y="150" width="30" height="140" rx="4" fill="url(#barGrad2)"/>
  <rect x="270" y="190" width="30" height="100" rx="4" fill="url(#barGrad2)" opacity="0.7"/>
  <rect x="310" y="220" width="30" height="70" rx="4" fill="url(#barGrad2)" opacity="0.5"/>
  
  <!-- X-axis labels -->
  <text x="155" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">🔴 Red Agent</text>
  <text x="285" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">🔵 Blue Agent</text>
  
  <!-- Legend -->
  <rect x="100" y="330" width="12" height="12" fill="#EF4444"/>
  <text x="120" y="340" font-family="Arial, sans-serif" font-size="8" fill="#94A3B8">Success Rate</text>
  <rect x="200" y="330" width="12" height="12" fill="#EF4444" opacity="0.7"/>
  <text x="220" y="340" font-family="Arial, sans-serif" font-size="8" fill="#94A3B8">Detection Rate</text>
  <rect x="300" y="330" width="12" height="12" fill="#EF4444" opacity="0.5"/>
  <text x="320" y="340" font-family="Arial, sans-serif" font-size="8" fill="#94A3B8">Response Rate</text>
  
  <!-- Donut Chart Area -->
  <rect x="410" y="50" width="350" height="180" rx="8" fill="#1E293B"/>
  <text x="585" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Session Statistics</text>
  
  <!-- Donut Chart -->
  <g transform="translate(500, 145)">
    <!-- Background circle -->
    <circle r="50" fill="#0F172A"/>
    <!-- Segments -->
    <circle r="50" fill="transparent" stroke="#EF4444" stroke-width="20" stroke-dasharray="78.5 235.5" transform="rotate(-90)"/>
    <circle r="50" fill="transparent" stroke="#22C55E" stroke-width="20" stroke-dasharray="62.8 251.2" transform="rotate(0)"/>
    <circle r="50" fill="transparent" stroke="#F59E0B" stroke-width="20" stroke-dasharray="47.1 266.9" transform="rotate(72)"/>
    <circle r="50" fill="transparent" stroke="#3B82F6" stroke-width="20" stroke-dasharray="62.8 251.2" transform="rotate(156)"/>
    <!-- Center text -->
    <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">156</text>
    <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94A3B8">Sessions</text>
  </g>
  
  <!-- Donut Legend -->
  <g transform="translate(600, 100)">
    <circle cx="10" cy="0" r="5" fill="#EF4444"/>
    <text x="25" y="4" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Critical (25%)</text>
    
    <circle cx="10" cy="25" r="5" fill="#22C55E"/>
    <text x="25" y="29" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Success (20%)</text>
    
    <circle cx="10" cy="50" r="5" fill="#F59E0B"/>
    <text x="25" y="54" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Warning (15%)</text>
    
    <circle cx="10" cy="75" r="5" fill="#3B82F6"/>
    <text x="25" y="79" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Info (20%)</text>
  </g>
  
  <!-- Stats Cards -->
  <rect x="410" y="245" width="160" height="70" rx="6" fill="#1E293B"/>
  <text x="490" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#EF4444">847</text>
  <text x="490" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Findings Detected</text>
  
  <rect x="585" y="245" width="175" height="70" rx="6" fill="#1E293B"/>
  <text x="672" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#22C55E">92%</text>
  <text x="672" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Human Feedback Rating</text>
  
  <!-- Trend Line -->
  <rect x="40" y="340" width="350" height="50" rx="6" fill="#1E293B"/>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Learning Progress</text>
  <polyline points="80,385 120,375 160,380 200,365 240,360 280,355 320,350 360,345" fill="none" stroke="#22C55E" stroke-width="2"/>
  <circle cx="360" cy="345" r="4" fill="#22C55E"/>
</svg>
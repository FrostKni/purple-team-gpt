[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purple-team-gpt"
version = "0.1.0"
description = "Autonomous Purple Team cybersecurity simulation framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "litellm>=1.20.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.0",
    "sqlmodel>=0.0.14",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "paramiko>=3.4.0",
    "fabric>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
]
orchestrator = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.0",
]
red-agent = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]
blue-agent = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]
full = [
    "purple-team-gpt[dev,orchestrator,red-agent,blue-agent]",
]

[project.scripts]
purple-team = "purple_team_gpt.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
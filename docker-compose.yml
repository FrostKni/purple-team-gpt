# Purple Team GPT - Docker Compose Configuration
# Complete orchestration for all services
# Version: 3.0 - With SSL/TLS and Secrets Support

services:
  # ============================================
  # Reverse Proxy - Nginx with SSL Termination
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: purple-team-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - purple-team-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  # ============================================
  # Certbot - Let's Encrypt Auto-Renewal
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: purple-team-certbot
    restart: unless-stopped
    profiles:
      - ssl
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/logs:/var/log/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - purple-team-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================
  # Backend Service - FastAPI Application
  # ============================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: ${APP_ENV:-production}
    container_name: purple-team-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # Application settings
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      # JWT settings
      - APP_JWT_ALGORITHM=${APP_JWT_ALGORITHM:-HS256}
      - APP_JWT_EXPIRE_MINUTES=${APP_JWT_EXPIRE_MINUTES:-60}
      # Rate limiting
      - APP_RATE_LIMIT_REQUESTS=${APP_RATE_LIMIT_REQUESTS:-100}
      - APP_RATE_LIMIT_WINDOW_SECONDS=${APP_RATE_LIMIT_WINDOW_SECONDS:-60}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost,https://localhost:3000}
      # LLM Configuration
      - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY:-}
      - LLM_ANTHROPIC_API_KEY=${LLM_ANTHROPIC_API_KEY:-}
      - LLM_GROQ_API_KEY=${LLM_GROQ_API_KEY:-}
      - LLM_DEEPSEEK_API_KEY=${LLM_DEEPSEEK_API_KEY:-}
      - LLM_MISTRAL_API_KEY=${LLM_MISTRAL_API_KEY:-}
      - LLM_OLLAMA_BASE_URL=${LLM_OLLAMA_BASE_URL:-http://ollama:11434}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:-openai}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-gpt-4o}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - LLM_ENABLE_FAILOVER=${LLM_ENABLE_FAILOVER:-true}
      # OpenAI-compatible endpoint
      - LLM_OPENAI_COMPATIBLE_API_KEY=${LLM_OPENAI_COMPATIBLE_API_KEY:-}
      - LLM_OPENAI_COMPATIBLE_BASE_URL=${LLM_OPENAI_COMPATIBLE_BASE_URL:-}
      - LLM_OPENAI_COMPATIBLE_MODEL=${LLM_OPENAI_COMPATIBLE_MODEL:-}
      # ChromaDB Configuration
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIR=/app/data/chromadb
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-purple_team_gpt}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      # Agent Configuration
      - AGENT_MAX_STEPS=${AGENT_MAX_STEPS:-50}
      - AGENT_TIMEOUT=${AGENT_TIMEOUT:-300}
      - AGENT_SAFE_MODE=${AGENT_SAFE_MODE:-true}
      - AGENT_AUTO_CONFIRM=${AGENT_AUTO_CONFIRM:-false}
    volumes:
      - chromadb_data:/app/data/chromadb
      - backend_logs:/app/logs
      # Development: Mount source for hot reload (remove in production)
      - ./src:/app/src:ro
    secrets:
      - source: app_secret_key
        target: app_secret_key
      - source: db_password
        target: db_password
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - purple-team-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # Frontend Service - React/Vite Application
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: ${APP_ENV:-production}
      args:
        - VITE_API_URL=${VITE_API_URL:-https://localhost}
        - VITE_WS_URL=${VITE_WS_URL:-wss://localhost}
    container_name: purple-team-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - purple-team-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ============================================
  # ChromaDB Service - Vector Database
  # ============================================
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: purple-team-chromadb
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_HTTP_BIND=0.0.0.0
      - ALLOW_RESET=${CHROMA_ALLOW_RESET:-false}
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_SERVER_AUTH_PROVIDER=${CHROMA_SERVER_AUTH_PROVIDER:-}
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-}
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - purple-team-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # PostgreSQL Service - Primary Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: purple-team-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=${DB_NAME:-purple_team_gpt}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - purple-team-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-purple_team_gpt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # Redis Service - Rate Limiting & Caching
  # ============================================
  redis:
    image: redis:7.2-alpine
    container_name: purple-team-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - purple-team-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================
  # Ollama Service - Local LLM (Optional)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: purple-team-ollama
    restart: unless-stopped
    profiles:
      - ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - purple-team-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# ============================================
# Docker Secrets
# ============================================
secrets:
  app_secret_key:
    file: ./secrets/app_secret_key.txt
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

# ============================================
# Named Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
    name: purple-team-postgres-data
  chromadb_data:
    driver: local
    name: purple-team-chromadb-data
  redis_data:
    driver: local
    name: purple-team-redis-data
  backend_logs:
    driver: local
    name: purple-team-backend-logs
  ollama_data:
    driver: local
    name: purple-team-ollama-data
  nginx_cache:
    driver: local
    name: purple-team-nginx-cache

# ============================================
# Networks
# ============================================
networks:
  purple-team-network:
    driver: bridge
    name: purple-team-network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16